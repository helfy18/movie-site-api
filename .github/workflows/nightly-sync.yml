name: Nightly sheet sync and site rebuild

# Pulls the Google Sheet into Mongo (with TMDB/OMDB enrichment for new or
# stale rows), then asks Netlify to rebuild the static site from the result.
# A failed sync skips the rebuild, so the previous site keeps serving.
on:
  schedule:
    # 12:11 UTC = 5:11 a.m. Pacific daylight, 4:11 a.m. standard. The odd
    # minute matters: GitHub delays scheduled runs most at the top of the
    # hour, and the old "0 9" start was landing four to seven hours late.
    - cron: "11 12 * * *"
  workflow_dispatch: # "sync now" after editing the sheet

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGOURI: ${{ secrets.MONGOURI }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
      TMDBKEY: ${{ secrets.TMDBKEY }}
      TMDBTOKEN: ${{ secrets.TMDBTOKEN }}
      OMDB_KEY: ${{ secrets.OMDB_KEY }}
      OMDB_KEY2: ${{ secrets.OMDB_KEY2 }}
      OMDB_KEY3: ${{ secrets.OMDB_KEY3 }}
      GOOGLE_SA_JSON: ${{ github.workspace }}/service-account.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write Google service account file
        run: printf '%s' "$GOOGLE_SA_JSON_CONTENT" > "$GOOGLE_SA_JSON"
        env:
          GOOGLE_SA_JSON_CONTENT: ${{ secrets.GOOGLE_SA_JSON_CONTENT }}

      - name: Check connections
        run: python3 scripts/syncMovies.py --check

      - name: Back up Mongo and the sheet
        run: python3 scripts/syncMovies.py --backup

      - name: Keep the backup for two weeks
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: scripts/backups/
          retention-days: 14

      - name: Sync sheet -> enrich -> Mongo -> sheet
        run: python3 scripts/syncMovies.py

      - name: Rebuild the static site
        run: curl --fail --silent --show-error -X POST "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
